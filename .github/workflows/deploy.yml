# Publikasi hanya dengan konfirmasi manual atau commit deploy khusus di branch Arena.
name: deploy

on:
  push:
    branches: [arena/81f3f141-weding-java]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Ketik tepat: DEPLOY-weding-java"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: weding-java-deployment
  cancel-in-progress: false

env:
  WRANGLER: npx --yes wrangler@4.165.0

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_deploy == 'DEPLOY-weding-java') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'DEPLOY-weding-java:')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tes
        run: node --test tests/*.test.mjs
      - name: Tolak database_id placeholder
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then
            echo "database_id di wrangler.toml masih placeholder."
            echo "Jalankan: npx wrangler d1 create weding-java lalu tempel ID-nya."
            exit 1
          fi
      - name: Terapkan migrasi D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: $WRANGLER d1 migrations apply weding-java --remote
      - name: Deploy Worker + aset
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: $WRANGLER deploy
